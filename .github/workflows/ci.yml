name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GEMINI_API_KEY: "fake-ci-key"
      LLM_MODEL: "gemini-3.1-flash-lite"
      MLFLOW_TRACKING_URI: "sqlite:///tmp/ci_mlflow.db"
      AIRFLOW_BASE_URL: "http://localhost:8080"
      K8S_NAMESPACE: "mlops-agent"
      APPROVED_NAMESPACES: "mlops-agent"

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint with Ruff
        run: |
          ruff check .
          ruff format --check .

      - name: Run Pytest Suite with Coverage
        run: |
          pytest -m "not integration" --cov=agent --cov=api --cov=training --cov-report=term-missing
