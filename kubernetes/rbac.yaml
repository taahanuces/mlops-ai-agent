apiVersion: v1
kind: ServiceAccount
metadata:
  name: mlops-agent-sa
  namespace: mlops-agent
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: mlops-agent-role
  namespace: mlops-agent
rules:
  - apiGroups: [""]
    resources: ["pods", "pods/log", "services", "endpoints", "configmaps", "events"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["apps"]
    resources: ["deployments", "deployments/scale"]
    verbs: ["get", "list", "watch", "patch", "update"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: mlops-agent-rolebinding
  namespace: mlops-agent
subjects:
  - kind: ServiceAccount
    name: mlops-agent-sa
    namespace: mlops-agent
roleRef:
  kind: Role
  name: mlops-agent-role
  apiGroup: rbac.authorization.k8s.io
