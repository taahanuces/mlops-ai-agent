services:
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow_password
      POSTGRES_DB: airflow
    ports:
      - "5432:5432"
    volumes:
      - postgres-db-volume:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U airflow"]
      interval: 5s
      retries: 5

  airflow-standalone:
    image: apache/airflow:3.3.0-python3.11
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow_password@postgres/airflow
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__CORE__SIMPLE_AUTH_MANAGER_USERS: "admin:admin"
      AIRFLOW__CORE__SIMPLE_AUTH_MANAGER_PASSWORDS_FILE: /opt/airflow/simple_auth_passwords.json
      AIRFLOW__API_AUTH__JWT_SECRET: "local-dev-jwt-secret-change-me-0123456789abcdef"
      _PIP_ADDITIONAL_REQUIREMENTS: "scikit-learn pandas joblib mlflow httpx"
      MLFLOW_TRACKING_URI: "http://host.docker.internal:5001"
      PYTHONPATH: /opt/airflow
      DATASET_VERSION: data-v2.0
      DATASET_PATH: /opt/airflow/data/dataset.csv
    ports:
      - "8080:8080"
    volumes:
      - ./dags:/opt/airflow/dags
      - ./training:/opt/airflow/training
      - ./agent:/opt/airflow/agent
      - ./data:/opt/airflow/data
      - ./models:/opt/airflow/models
      - ./airflow_config/simple_auth_passwords.json:/opt/airflow/simple_auth_passwords.json
    command: standalone

volumes:
  postgres-db-volume:
